[package]
name = "pyxforge-desktop"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pyxforge-desktop"
path = "src/main.rs"

[dependencies]
pyxforge_core = { package = "pyxforge-core", path = "../core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "syntect"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
chrono = "0.4"
