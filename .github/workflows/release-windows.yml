name: Windows release

# Builds the Windows installer and portable archive (tools/winpkg), checks them, and attaches
# them to the tag's GitHub Release (.github/scripts/release-assets.sh).
#
# - A pushed tag vX.Y.Z (or vX.Y.Z-rc.1) builds that tag. With no release for the tag yet, a
#   DRAFT release is created with the three files (a pre-release when the version has a
#   suffix); a maintainer reviews and publishes it. With a release already there, the files
#   are attached to it if it has none of them, and left alone if it has all three.
# - Run by hand with a tag (an existing one, such as v3.0.0-rc.2), it builds that tag's source
#   with this workflow and attaches the files the same way: the way to fill or check the
#   release of a tag pushed before a fix here, since re-running a tag's run uses the workflow
#   as it was at the tag.
# - Run by hand with a version only, it builds the current branch and keeps the files as a
#   workflow artifact; nothing is released.
#
# A release is never published, deleted or overwritten here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the files to (such as v3.0.0-rc.2); empty for an artifact-only build
        required: false
        default: ''
      version:
        description: Version for an artifact-only build without a tag (such as 3.0.0-dev.1)
        required: false
        default: 3.0.0-dev.1

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The tag being released (pushed, or named when run by hand), else this branch.
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag=""; fi
          if [ -n "$tag" ]; then v="${tag#v}"; else v="$INPUT_VERSION"; fi
          # tools/winpkg checks the form again; refuse anything but a plain version here too.
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$v' is not a version such as 3.0.0 or 3.1.0-rc.1"; exit 1
          fi
          if [ -n "$tag" ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$tag^{commit}")" ]; then
            echo "::error::checked out $(git rev-parse HEAD), not $tag"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building PyxForge $v from $(git rev-parse --short HEAD)${tag:+ (tag $tag)}"

      # Fyne needs cgo. Use the runner's MinGW gcc when the image has one; otherwise install it.
      - name: Install a C compiler for cgo
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw --no-progress -y
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi
          gcc --version | head -1

      # Inno Setup 6.7.3, the official installer, checked against its published SHA-256.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $exe
          $sum = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw "Inno Setup installer SHA-256 $sum does not match" }
          $dir = "$env:RUNNER_TEMP\InnoSetup"
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe was not installed" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: set -o pipefail; go test -count=1 -json ./... | go run ./tools/testsummary

      - name: Build the installer and the portable archive
        shell: bash
        run: go run ./tools/winpkg -version "${{ steps.version.outputs.version }}" -out dist/windows -iscc "$ISCC"

      - name: Check the files
        shell: bash
        working-directory: dist/windows
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for f in "PyxForge-Setup-$VERSION.exe" "PyxForge-Portable-$VERSION.zip" SHA256SUMS.txt; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          sha256sum -c SHA256SUMS.txt
          "PyxForge-$VERSION/pyxforge.com" version

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: pyxforge-windows-${{ steps.version.outputs.version }}
          path: |
            dist/windows/PyxForge-Setup-*.exe
            dist/windows/PyxForge-Portable-*.zip
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the GitHub Release
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # create a draft release and upload its files; nothing else
    steps:
      - name: Checkout the release script
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          ref: ${{ github.sha }}

      - name: Fetch the files
        uses: actions/download-artifact@v4
        with:
          name: pyxforge-windows-${{ needs.build.outputs.version }}
          path: files

      - name: Attach and check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-assets.sh "${{ needs.build.outputs.tag }}" "${{ needs.build.outputs.version }}" files
