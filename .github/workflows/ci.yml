name: CI

on:
  push:
    branches: [ main, v3 ]
  pull_request:
    branches: [ main, v3 ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PyxForge 3.0: Go + Fyne. Per-commit gates from refactor-v2.md Section 16.1.
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        if: runner.os == 'Linux'
        # GLFW 3.4 builds its X11 and Wayland backends on Linux; the list matches Fyne's own CI.
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev libx11-dev xorg-dev libwayland-dev libxkbcommon-dev

      # Fyne needs cgo. Use the runner's MinGW gcc when the image has one; otherwise install it.
      - name: Install a C compiler for cgo
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw --no-progress -y
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi

      - name: Show the C compiler
        shell: bash
        run: gcc --version

      - name: Forbidden-technology check
        run: go run ./tools/forbidcheck

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        shell: bash
        run: .github/scripts/run-annotated.sh "go vet" go vet ./...

      - name: Staticcheck
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          .github/scripts/run-annotated.sh "staticcheck" staticcheck ./...

      - name: Test
        shell: bash
        run: .github/scripts/run-annotated.sh "go test" go test -race ./...

  # D5: macOS is compile-checked, not released.
  go-macos:
    name: Go (macOS compile check)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: .github/scripts/run-annotated.sh "go build (macOS)" go build ./...

      - name: Vet
        shell: bash
        run: .github/scripts/run-annotated.sh "go vet (macOS)" go vet ./...

  # 2.x stack, kept under legacy/ until the parity gate (D8). The Rust core tests are the
  # parity oracle for the Go port (D1).
  legacy:
    name: Legacy 2.x (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: legacy/core

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: legacy/extension

      # --- Rust Core Verification ---
      - name: Build Rust Core
        run: cargo build --verbose
        working-directory: legacy/core

      - name: Run Rust Core Tests
        shell: bash
        run: ../../.github/scripts/run-annotated.sh "cargo test" cargo test --verbose
        working-directory: legacy/core

      - name: Run Clippy
        shell: bash
        run: ../../.github/scripts/run-annotated.sh "clippy" cargo clippy --all-targets --all-features -- -D warnings
        working-directory: legacy/core

      - name: Check Rust Formatting
        run: cargo fmt --check
        working-directory: legacy/core

      - name: Generate Rust Documentation
        run: cargo doc --no-deps
        working-directory: legacy/core

      # --- VS Code Extension Verification ---
      - name: Type check extension
        run: npm run check-types
        working-directory: legacy/extension

      - name: Lint extension
        run: npm run lint
        working-directory: legacy/extension

      - name: Build Extension
        run: npm run build
        working-directory: legacy/extension

      - name: Run Extension Tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ../../.github/scripts/run-annotated.sh "extension tests" xvfb-run npm test
          else
            ../../.github/scripts/run-annotated.sh "extension tests" npm test
          fi
        shell: bash
        working-directory: legacy/extension
