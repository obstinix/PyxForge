name: CI

on:
  push:
    branches: [ main, v3 ]
  pull_request:
    branches: [ main, v3 ]

permissions:
  contents: read

# A pull request's newer push supersedes its older run. Every commit pushed to a branch gets
# its own group and finishes, so main has a result for each commit, not only the last.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PyxForge 3.0: Go + Fyne. Per-commit gates from refactor-v2.md Section 16.1.
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang fails here, not after GitHub's six hours. The Windows job runs the suite twice (with
    # and without the race detector) and builds the release; it took 31 minutes at ab5422a.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        if: runner.os == 'Linux'
        # GLFW 3.4 builds its X11 and Wayland backends on Linux; the list matches Fyne's own CI.
        run: .github/scripts/apt-install.sh gcc libgl1-mesa-dev libx11-dev xorg-dev libwayland-dev libxkbcommon-dev

      # The editor engine's tests drive a real Neovim and clangd (internal/neovim); they skip
      # without them.
      - name: Install Neovim and clangd
        if: runner.os == 'Linux'
        run: .github/scripts/apt-install.sh neovim clangd && nvim --version | head -1

      # pyright, pinned, for TestPythonLanguageServer (#70); the runner's Node.js runs it.
      - name: Install pyright
        if: runner.os == 'Linux'
        run: npm install -g pyright@1.1.390 && pyright --version

      # On Windows, the Neovim PyxForge's installer bundles (tools/winpkg pins the same version
      # and SHA-256), so the editor, terminal and Run Current File tests run there too (#38).
      - name: Install Neovim (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/nvim.zip" https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-win64.zip
          echo "4e12b7103b601ffc8f25954b4da100f339faa73dccb69a5b135e897fa3d893ed  $RUNNER_TEMP/nvim.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/nvim.zip" -d "$RUNNER_TEMP/nvim"
          echo "$RUNNER_TEMP/nvim/nvim-win64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nvim/nvim-win64/bin/nvim.exe" --version | head -1

      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # nasm.us's own build, pinned by SHA-256, rather than Chocolatey, whose feed timed out (504)
          # on 848e4f4 and failed the job before any test ran.
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/nasm.zip" https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip
          echo "3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6  $RUNNER_TEMP/nasm.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/nasm.zip" -d "$RUNNER_TEMP/nasm"
          echo "$RUNNER_TEMP/nasm/nasm-2.16.03" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nasm/nasm-2.16.03/nasm.exe" -v

      # The run and debug tests boot a real boot sector in QEMU and attach GDB to it
      # (internal/qemu, internal/gdb, internal/cli); they skip without these tools.
      - name: Install QEMU, qemu-img, GDB and NASM
        if: runner.os == 'Linux'
        run: .github/scripts/apt-install.sh --no-install-recommends qemu-system-x86 qemu-utils gdb nasm && qemu-system-x86_64 --version | head -1

      # Fyne needs cgo. Use the runner's MinGW gcc when the image has one; otherwise install it.
      - name: Install a C compiler for cgo
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw --no-progress -y
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi

      - name: Show the C compiler
        shell: bash
        run: gcc --version

      # Run Current File's interpreters that the runner images lack (#46): tsx for TypeScript on
      # both, Lua on Linux. Java, PowerShell, Ruby, PHP and Perl come with the images, and batch
      # files with Windows.
      - name: Install tsx and Lua
        shell: bash
        run: |
          npm install -g tsx@4.23.15 && tsx --version
          if [ "$RUNNER_OS" = Linux ]; then
            .github/scripts/apt-install.sh --no-install-recommends lua5.4
            command -v lua >/dev/null || sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
            lua -v
          fi

      # Delve, for Debug Current File's Go tests (TestDebugsForReal/Go, #45), pinned.
      - name: Install Delve
        shell: bash
        run: go install github.com/go-delve/delve/cmd/dlv@v1.27.2 && dlv version | head -2

      # Neovim runs under a crash catcher on Windows (#80): its crashes leave no dump of their
      # own. Every later step starts Neovim through it; a crash writes a minidump and a report
      # naming the module, the offset and the command line, uploaded below.
      - name: Catch Neovim crashes
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/crashdump.exe" ./tools/crashdump
          echo "PYXFORGE_NVIM_WRAPPER=$(cygpath -w "$RUNNER_TEMP/crashdump.exe")" >> "$GITHUB_ENV"
          echo "PYXFORGE_CRASHDUMP_DIR=$(cygpath -w "$RUNNER_TEMP/crashdumps")" >> "$GITHUB_ENV"

      # QEMU for Windows through PyxForge's own toolchain manager, as a user gets it (#38): the
      # pinned build, its installer checked against its SHA-256 and run elevated (the runner's
      # account is an administrator, so Windows asks nothing), then checked again with verify.
      # The run, debug and snapshot tests then use it instead of skipping.
      - name: Install QEMU with PyxForge
        if: runner.os == 'Windows'
        timeout-minutes: 20
        shell: bash
        run: |
          go run ./cmd/pyxforge toolchains install qemu
          go run ./cmd/pyxforge toolchains verify qemu
          "$PROGRAMFILES/qemu/qemu-system-x86_64.exe" --version | head -1

      - name: Forbidden-technology check
        run: go run ./tools/forbidcheck

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        shell: bash
        run: .github/scripts/run-annotated.sh "go vet" go vet ./...

      - name: Staticcheck
        shell: bash
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          .github/scripts/run-annotated.sh "staticcheck" staticcheck ./...

      # The race-detector run also measures coverage (#44); the run below stays uninstrumented,
      # at full speed. The profile goes to the runner's temp folder, outside the checkout, so the
      # release build's VCS stamp doesn't see an untracked file.
      - name: Test
        shell: bash
        run: .github/scripts/run-annotated.sh "go test" go test -race -coverprofile="$RUNNER_TEMP/coverage.out" -coverpkg=./... ./...

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          [ -s "$RUNNER_TEMP/coverage.out" ] || { echo "no coverage profile"; exit 0; }
          { echo "### Coverage (${{ runner.os }}, race-detector run)"; echo; go run ./tools/coverreport -module github.com/obstinix/PyxForge "$RUNNER_TEMP/coverage.out"; } > "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"
          sed -n 3p "$RUNNER_TEMP/coverage.md"

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ runner.os }}
          path: |
            ${{ runner.temp }}/coverage.out
            ${{ runner.temp }}/coverage.md
          if-no-files-found: ignore
          retention-days: 14

      # The race detector slows everything down, which once hid an ordering bug (keys typed
      # right after switching tabs reached the previous buffer). Run at full speed too, and list
      # the integration tests that skipped for want of a tool, as a notice: "ok" hides them.
      # A test that skips for want of a tool this job installs fails it (#38): a broken install
      # would otherwise pass as "ok".
      - name: Test without the race detector
        shell: bash
        env:
          REQUIRED: '(qemu-system-x86_64|qemu-system-i386|qemu-img|gdb|nvim|nasm) is not installed|QEMU needs|Go debugging needs dlv|TypeScript needs tsx'
        run: |
          [ "$RUNNER_OS" = Linux ] && REQUIRED="$REQUIRED|Lua needs lua"
          [ "$RUNNER_OS" = Windows ] && REQUIRED="$REQUIRED|MSVC is not installed|the OEM code page is"
          export REQUIRED
          .github/scripts/run-annotated.sh "go test (no race detector)" bash -c 'set -o pipefail; go test -count=1 -json ./... | go run ./tools/testsummary -fail-skips "$REQUIRED"'

      # Windows as a program started from Explorer or PowerShell sees it (#39): System32 first on
      # PATH (its bash.exe, where WSL is installed, starts WSL, which can't open a Windows path)
      # and TEMP spelled with 8.3 short names. Git Bash, which runs the steps above, puts Git's
      # own tools first, which once hid a Run Current File bug (fixed in 4ef02df).
      - name: Test from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("$env:USERPROFILE\AppData\Local\Temp").ShortPath
          $env:TEMP = $short
          $env:TMP = $short
          "bash: $((Get-Command bash -All -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source) -join ', ')"
          "TEMP: $env:TEMP"
          go test -count=1 ./internal/runfile ./internal/toolchain ./internal/git ./internal/proc ./internal/askpass
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -run '^(TestRunCurrentFile|TestTerminalSessions|TestShellScriptRuns.*)$' ./internal/ui/shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A short fuzzing pass over each parser of input PyxForge doesn't control (#43); the Fuzz
      # workflow runs them for longer every night. tools/workflowcheck checks the list is complete.
      - name: Fuzz briefly
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for t in inspect:FuzzReadELF inspect:FuzzDisassemble gdb:FuzzParseRecord git:FuzzParseStatus config:FuzzParse config:FuzzSetValue build:FuzzDiagnostics listing:FuzzParseNASM; do
            go test "./internal/${t%%:*}" -run '^$' -fuzz "^${t#*:}\$" -fuzztime 10s
          done

      - name: Welcome preferences integration test
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/run-annotated.sh "go test (preferences integration)" go test -tags ci -count=1 ./internal/ui/shell -run '^TestWelcomePreferencesAcrossProcesses$'

      # A reproducible release build (tools/release checks two builds match), kept as a
      # workflow artifact for testing; nothing is published.
      - name: Release build
        shell: bash
        run: .github/scripts/run-annotated.sh "release build" go run ./tools/release -version "3.0.0-dev+${GITHUB_SHA::7}" -out dist

      # The Debian package, portable archive and AppImage of that program: the package installed
      # with apt and run as a user would, then removed; the archive and the AppImage run.
      - name: Linux packages, installed and removed
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          v="3.0.0-dev.${GITHUB_RUN_NUMBER}"
          go run ./tools/linuxpkg -version "$v" -binary "dist/pyxforge-3.0.0-dev+${GITHUB_SHA::7}-linux-amd64" -out dist/linux -appimage
          deb="dist/linux/PyxForge-$v-linux-x64.deb"
          dpkg-deb --info "$deb"
          sudo apt-get install -y --no-install-recommends "./$deb"  # a local file
          dpkg -s pyxforge | grep -E '^(Status|Version):'
          /usr/bin/pyxforge version
          test -f /usr/share/applications/io.github.obstinix.pyxforge.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.obstinix.pyxforge.png
          sudo apt-get remove -y pyxforge
          test ! -e /usr/bin/pyxforge
          mkdir -p portable && tar -xzf "dist/linux/PyxForge-Portable-$v-linux-x64.tar.gz" -C portable
          "portable/PyxForge-$v/pyxforge" version
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/linux/PyxForge-$v-linux-x64.AppImage" version
          (cd dist/linux && sha256sum -c SHA256SUMS-linux.txt)

      - name: Upload Neovim crash dumps
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neovim-crashdumps
          path: ${{ runner.temp }}/crashdumps
          if-no-files-found: ignore

      - name: Upload the release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyxforge-${{ runner.os }}
          path: dist/*
          retention-days: 14

  # Known vulnerabilities in the Go modules and the Go standard library that PyxForge's code
  # reaches (#37). govulncheck exits non-zero when it finds one, which fails the job. Windows is
  # the main release platform and has its own code paths, so it is scanned as well as Linux.
  govulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Type-checking Fyne's GLFW driver runs cgo, which needs the X11 and Wayland headers.
      - name: Install Fyne build dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/apt-install.sh gcc libgl1-mesa-dev libx11-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install a C compiler for cgo
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw --no-progress -y
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi

      - name: govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # PyxForge's Neovim configuration (nvim/): formatting and lint gates from Section 16.1.
  lua:
    name: Lua (Neovim configuration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: StyLua
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check --config-path nvim/stylua.toml nvim

      - name: Luacheck
        run: |
          .github/scripts/apt-install.sh lua-check
          cd nvim && luacheck .

  # D5: macOS isn't released, but its tests run (#40), with the tools Homebrew has for Apple
  # silicon. GDB isn't one of them, so the debugger's tests skip here.
  go-macos:
    name: Go (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Neovim, QEMU and NASM
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install neovim qemu nasm
          nvim --version | head -1
          qemu-system-x86_64 --version | head -1
          nasm -v

      - name: Build
        shell: bash
        run: .github/scripts/run-annotated.sh "go build (macOS)" go build ./...

      - name: Vet
        shell: bash
        run: .github/scripts/run-annotated.sh "go vet (macOS)" go vet ./...

      # A test that skips for want of a tool this job installs fails it (#38). macOS is not a
      # released platform (D5) and its first test run found 21 failing tests (#89), so this
      # step reports without failing the run until they are fixed.
      - name: Test
        shell: bash
        continue-on-error: true
        env:
          REQUIRED: '(qemu-system-x86_64|qemu-system-i386|qemu-img|nvim|nasm) is not installed|QEMU needs'
        run: .github/scripts/run-annotated.sh "go test (macOS)" bash -c 'set -o pipefail; go test -count=1 -json ./... | go run ./tools/testsummary -fail-skips "$REQUIRED"'

  # 2.x stack, kept under legacy/ until the parity gate (D8). The Rust core tests are the
  # parity oracle for the Go port (D1).
  legacy:
    name: Legacy 2.x (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup is on every hosted runner, so no third-party action (and no branch ref) is
      # needed to pick the stable toolchain (#32).
      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: legacy/core

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: legacy/extension

      # --- Rust Core Verification ---
      - name: Build Rust Core
        run: cargo build --verbose
        working-directory: legacy/core

      - name: Run Rust Core Tests
        shell: bash
        run: ../../.github/scripts/run-annotated.sh "cargo test" cargo test --verbose
        working-directory: legacy/core

      - name: Run Clippy
        shell: bash
        run: ../../.github/scripts/run-annotated.sh "clippy" cargo clippy --all-targets --all-features -- -D warnings
        working-directory: legacy/core

      - name: Check Rust Formatting
        run: cargo fmt --check
        working-directory: legacy/core

      - name: Generate Rust Documentation
        run: cargo doc --no-deps
        working-directory: legacy/core

      # --- VS Code Extension Verification ---
      - name: Type check extension
        run: npm run check-types
        working-directory: legacy/extension

      - name: Lint extension
        run: npm run lint
        working-directory: legacy/extension

      - name: Build Extension
        run: npm run build
        working-directory: legacy/extension

      - name: Run Extension Tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ../../.github/scripts/run-annotated.sh "extension tests" xvfb-run npm test
          else
            ../../.github/scripts/run-annotated.sh "extension tests" npm test
          fi
        shell: bash
        working-directory: legacy/extension
