name: CI

on:
  push:
    branches: [ main, v3 ]
  pull_request:
    branches: [ main, v3 ]

jobs:
  # PyxForge 3.0: Go + Fyne. Per-commit gates from refactor-v2.md Section 16.1.
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Fyne build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Forbidden-technology check
        run: go run ./tools/forbidcheck

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: Test
        run: go test -race ./...

  # 2.x stack, kept under legacy/ until the parity gate (D8). The Rust core tests are the
  # parity oracle for the Go port (D1).
  legacy:
    name: Legacy 2.x (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: legacy/core

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: legacy/extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: legacy/extension

      # --- Rust Core Verification ---
      - name: Build Rust Core
        run: cargo build --verbose
        working-directory: legacy/core

      - name: Run Rust Core Tests
        run: cargo test --verbose
        working-directory: legacy/core

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: legacy/core

      - name: Check Rust Formatting
        run: cargo fmt --check
        working-directory: legacy/core

      - name: Generate Rust Documentation
        run: cargo doc --no-deps
        working-directory: legacy/core

      # --- VS Code Extension Verification ---
      - name: Type check extension
        run: npm run check-types
        working-directory: legacy/extension

      - name: Lint extension
        run: npm run lint
        working-directory: legacy/extension

      - name: Build Extension
        run: npm run build
        working-directory: legacy/extension

      - name: Run Extension Tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run npm test
          else
            npm test
          fi
        shell: bash
        working-directory: legacy/extension
