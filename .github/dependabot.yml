# Proposes dependency updates as pull requests (#36). Actions are pinned by commit SHA with
# the version in a comment (#32); Dependabot updates the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # golang.org/x/* move together and are usually harmless to take as one change.
      golang-x:
        patterns: ["golang.org/x/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
