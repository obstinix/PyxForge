<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">PyxForge workbench layout</title>
  <desc id="d">Wireframe of the PyxForge window: activity rail, file explorer, tabbed Neovim editor, inspector, bottom panel and status bar.</desc>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#e6e6e6}
    .dim{fill:#9a9a9a;font-size:11px}
    .box{fill:#161616;stroke:#3a3a3a;stroke-width:1.5}
    .acc{fill:#1d1d1d;stroke:#e6e6e6;stroke-width:1.5}
    .tab{fill:#232323;stroke:#3a3a3a}
  </style>
  <rect width="960" height="540" rx="14" fill="#0e0e0e"/>
  <!-- title bar -->
  <rect x="16" y="16" width="928" height="30" class="box"/>
  <text x="30" y="36">PyxForge  ·  ~/projects/boot-sector</text>
  <text x="760" y="36" class="dim">palette: Ctrl+Shift+P</text>
  <!-- rail -->
  <rect x="16" y="52" width="48" height="418" class="box"/>
  <text x="26" y="82">FS</text><text x="26" y="122">GT</text><text x="26" y="162">BD</text><text x="26" y="202">QM</text><text x="26" y="242">DB</text>
  <text x="22" y="456" class="dim">rail</text>
  <!-- explorer -->
  <rect x="70" y="52" width="180" height="418" class="box"/>
  <text x="82" y="76">EXPLORER</text>
  <text x="82" y="104" class="dim">▾ src/</text><text x="94" y="124" class="dim">boot.asm</text><text x="94" y="144" class="dim">kernel.c</text>
  <text x="82" y="168" class="dim">▸ nvim/</text><text x="82" y="192" class="dim">pyxforge.toml</text>
  <!-- tabs -->
  <rect x="256" y="52" width="478" height="28" class="box"/>
  <rect x="260" y="56" width="110" height="22" class="tab"/><text x="268" y="72">boot.asm</text>
  <rect x="374" y="56" width="110" height="22" class="tab"/><text x="382" y="72">kernel.c ●</text>
  <!-- editor -->
  <rect x="256" y="84" width="478" height="248" class="acc"/>
  <text x="270" y="108" class="dim">EDITOR  ·  embedded Neovim</text>
  <text x="270" y="136">  1  bits 16</text>
  <text x="270" y="156">  2  org 0x7C00</text>
  <text x="270" y="176">  3  start:  cli</text>
  <text x="270" y="196">  4         mov si, msg</text>
  <text x="270" y="228" class="dim">grid + cursor rendered by Fyne</text>
  <!-- inspector -->
  <rect x="740" y="52" width="204" height="280" class="box"/>
  <text x="752" y="76">INSPECTOR</text>
  <text x="752" y="104" class="dim">registers</text><text x="752" y="124" class="dim">memory / hex</text><text x="752" y="144" class="dim">ELF sections</text>
  <!-- bottom panel -->
  <rect x="256" y="338" width="688" height="132" class="box"/>
  <text x="270" y="360">PANEL</text>
  <text x="330" y="360" class="dim">Terminal · Build · Problems · QEMU serial · Git</text>
  <text x="270" y="390" class="dim">$ pyxforge build</text>
  <text x="270" y="410" class="dim">PyxForge boot sector OK</text>
  <!-- status -->
  <rect x="16" y="476" width="928" height="26" class="box"/>
  <text x="28" y="494" class="dim">main  ·  NORMAL  ·  UTF-8  ·  qemu: stopped  ·  gdb: detached</text>
  <text x="16" y="526" class="dim">Figure 1: Workbench layout (illustrative wireframe)</text>
</svg>
